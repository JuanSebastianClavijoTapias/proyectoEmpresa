{% extends "base.html" %}

{% block title %}Eliminar Nota{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-trash"></i> Eliminar Nota</h1>
</div>

<div class="card">
    <div class="card-body">
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i>
            ¿Estás seguro de que deseas eliminar la nota <strong>"{{ nota.titulo }}"</strong>?
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Sí, Eliminar
                </button>
                <a href="{% url 'analisis:lista_notas' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
