{% extends "base.html" %}

{% block title %}Eliminar Objetivo{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-trash"></i> Eliminar Objetivo</h1>
</div>

<div class="card">
    <div class="card-body">
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i>
            ¿Estás seguro de que deseas eliminar el objetivo de <strong>{{ objetivo.mes|date:"F Y" }}</strong>?
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Sí, Eliminar
                </button>
                <a href="{% url 'analisis:lista_objetivos' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
