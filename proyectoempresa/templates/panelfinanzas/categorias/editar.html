{% extends 'base.html' %}
{% block title %}Editar {{ categoria.nombre }} - Finanzas{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-pencil me-2"></i>Editar Categoría</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-tag me-2"></i>Información de la Categoría
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        {{ form.nombre }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Descripción</label>
                        {{ form.descripcion }}
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'finanzas:lista_categorias' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
