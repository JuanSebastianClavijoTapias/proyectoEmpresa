{% extends 'base.html' %}
{% block title %}Editar Gasto - Finanzas{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'finanzas:lista_gastos' %}">Gastos</a></li>
            <li class="breadcrumb-item active">Editar Gasto</li>
        </ol>
    </nav>
    <h1><i class="bi bi-pencil me-2"></i>Editar Gasto</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Descripción *</label>
                        {{ form.descripcion }}
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Categoría *</label>
                        {{ form.categoria }}
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Monto *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            {{ form.monto }}
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Fecha *</label>
                        {{ form.fecha }}
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                {{ form.observaciones }}
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>Actualizar Gasto
                </button>
                <a href="{% url 'finanzas:lista_gastos' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-2"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
