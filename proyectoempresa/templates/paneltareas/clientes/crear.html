{% extends 'base.html' %}

{% block title %}Nuevo Cliente - Tapicería{% endblock %}

{% block content %}
<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'tareas:lista_clientes' %}">Clientes</a></li>
            <li class="breadcrumb-item active">Nuevo Cliente</li>
        </ol>
    </nav>
    <h1><i class="bi bi-person-plus"></i> Nuevo Cliente</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        {{ form.nombre }}
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Teléfono *</label>
                        {{ form.telefono }}
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                {{ form.email }}
            </div>
            
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                {{ form.direccion }}
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i> Guardar Cliente
                </button>
                <a href="{% url 'tareas:lista_clientes' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle me-2"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
